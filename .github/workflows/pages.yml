name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/spanish-pwa-city-app-3oghmr]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # Сборка и сквозные тесты в браузере: деплой только если всё прошло.
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 1

  # Приложение для Android: та же сборка внутри APK (Capacitor, проект android/). Идёт параллельно с тестами.
  # Android SDK на раннере уже есть ($ANDROID_HOME), недостающие платформы Gradle докачивает сам после лицензий.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Лицензии Android SDK
        run: yes | "$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort | tail -1)" --licenses > /dev/null || true
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

  # Сайт и APK вместе: eslacity.apk лежит рядом с игрой, в precache он не входит (добавлен после сборки).
  package:
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk
      - run: cp apk/app-release.apk dist/eslacity.apk
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
